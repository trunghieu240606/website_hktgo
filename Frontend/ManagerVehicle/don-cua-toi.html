    <script>
      (function () {
        function checkLogin() {
          try {
            var raw = localStorage.getItem("thong_tin_user");
            if (!raw) raw = sessionStorage.getItem("thong_tin_user");
            if (!raw) {
              var match = document.cookie.match(new RegExp("(^| )thong_tin_user=([^;]+)"));
              if (match) raw = decodeURIComponent(match[2]);
            }
            if (!raw) {
              var searchParams = new URLSearchParams(window.location.search);
              var u = searchParams.get("u");
              if (u) {
                raw = decodeURIComponent(u);
                try { localStorage.setItem("thong_tin_user", raw); } catch (_) {}
                try { sessionStorage.setItem("thong_tin_user", raw); } catch (_) {}
              }
            }
            if (!raw) return null;
            var user = JSON.parse(raw);
            if (!user || (!user.email && !user.id)) return null;
            return user;
          } catch (e) {
            return null;
          }
        }
        var loggedUser = checkLogin();
        if (!loggedUser) {
          alert("Vui lòng đăng nhập để xem đơn của bạn!");
          window.location.replace("admin/login.html");
        }
      })();
    </script>

    <script src="js/scrollax.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVWaKrjvy3MaE7SQ74_uJiULgl1JY0H2s&sensor=false"></script>
    <script src="js/google-map.js"></script>
    <script src="js/main.js"></script>
    <script src="js/common-auth.js"></script>
    <script src="js/common-chat.js"></script>
    <script src="js/common-payment-qr.js"></script>
    <script src="js/common-vehicle-options.js"></script>
    <script>
      HKTChat.initDirectChat();
    </script>
    <script>
      window.addEventListener("load", function () {
        var ld = document.getElementById("ftco-loader");
        if (ld) ld.classList.remove("show");
      });
    </script>
    <script>
      (function () {
        var API_BASE = (function () {
          var h = window.location.hostname;
          if (!h || h === "localhost") return "http://127.0.0.1:8081";
          return "http://" + h + ":8081";
        })();

        var emailHienTai = "";
        var sdtTuDong = "";
        var activeTab = "cho";
        var currentBuckets = { cho: [], dang: [], xong: [], huy: [] };
        var paymentQrFlowOrders = null;
        var donDangXemId = null;
        var danhSachXeKho = [];

        var tabMeta = {
          cho: { title: "Đơn chờ thanh toán / duyệt" },
          dang: { title: "Đơn đang thuê" },
          xong: { title: "Đơn đã hoàn thành" },
          huy: { title: "Đơn đã hủy" }
        };

        function layUser() {
          try {
            var raw = localStorage.getItem("thong_tin_user");
            if (!raw) return null;
            return JSON.parse(raw);
          } catch (e) {
            return null;
          }
        }

        function formatTien(n) {
          if (n == null || isNaN(n)) return "—";
          return Number(n).toLocaleString("vi-VN") + " ₫";
        }

        function escAttr(v) {
          return String(v == null ? "" : v).replace(/"/g, "&quot;");
        }

        function parseExpireAtMs(value) {
          if (!value) return 0;
          var ms = Date.parse(value);
          return isNaN(ms) ? 0 : ms;
        }

        function maNhomDon(d) {
          return d.maNhomDon || d.id;
        }

        function gomDonTheoNhom(arr) {
          var map = {};
          (arr || []).forEach(function (d) {
            var k = String(maNhomDon(d));
            if (!map[k]) {
              map[k] = { maNhom: maNhomDon(d), dong: [], daiDien: d };
            }
            map[k].dong.push(d);
          });
          return Object.keys(map).map(function (k) {
            return map[k];
          });
        }

        function tongTienNhom(nhom) {
          var tong = 0;
          (nhom.dong || []).forEach(function (d) {
            var tt = String(d.trangThai || "").trim();
            if (tt !== "Đã hủy" && d.tongTien != null) tong += Number(d.tongTien) || 0;
          });
          return tong;
        }

        function htmlDanhSachXeTrongNhom(nhom) {
          return (nhom.dong || [])
            .filter(function (d) {
              return String(d.trangThai || "").trim() !== "Đã hủy";
            })
            .map(function (d) {
              return (
                '<span class="order-vehicle-tag" title="' +
                escAttr(d.bienSo || "") +
                '">' +
                escAttr(d.tenXe || "Xe") +
                "</span>"
              );
            })
            .join("");
        }

        function nutQuanLyDon(nhom) {
          var d = nhom.daiDien;
          var tt = String(d.trangThai || "").trim();
          var sdt = (d.soDienThoai || "").replace(/"/g, "");
          var nut =
            '<button type="button" class="btn btn-sm btn-outline-secondary mr-1 btn-xem-don" data-id="' +
            d.id +
            '" data-sdt="' +
            sdt +
            '">Xem đơn</button>';

          if (tt === "Chờ thanh toán" || tt === "Chờ duyệt") {
            nut +=
              '<button type="button" class="btn btn-sm btn-outline-success mr-1 btn-them-xe-don" data-id="' +
              d.id +
              '" data-sdt="' +
              sdt +
              '">Thêm xe</button>';
          }

          var hanMs = parseExpireAtMs(d.hanThanhToan);
          var quaHan = tt === "Chờ thanh toán" && hanMs > 0 && Date.now() > hanMs;
          var tongNhom = tongTienNhom(nhom);

          if (tt === "Chờ thanh toán") {
            if (quaHan) {
              nut +=
                '<span class="text-danger small d-block mb-1 mt-1">Đơn đã quá hạn.</span>' +
                '<button type="button" class="btn btn-sm btn-outline-danger btn-huy-don" data-id="' +
                d.id +
                '" data-sdt="' +
                sdt +
                '">Hủy đơn</button>';
            } else {
              nut +=
                '<button type="button" class="btn btn-sm btn-primary mr-1 btn-mo-qr" data-id="' +
                d.id +
                '" data-sdt="' +
                escAttr((d.soDienThoai || "").replace(/\D/g, "")) +
                '" data-email="' +
                escAttr(d.emailKhach || "") +
                '" data-tien="' +
                escAttr(tongNhom) +
                '" data-han="' +
                escAttr(d.hanThanhToan || "") +
                '">Thanh toán QR</button>' +
                '<button type="button" class="btn btn-sm btn-success mr-1 btn-xac-nhan-tt" data-id="' +
                d.id +
                '" data-sdt="' +
                sdt +
                '">Đã thanh toán</button>' +
                '<button type="button" class="btn btn-sm btn-outline-danger btn-huy-don" data-id="' +
                d.id +
                '" data-sdt="' +
                sdt +
                '">Hủy đơn</button>';
            }
          } else if (tt === "Chờ duyệt") {
            nut +=
              '<button type="button" class="btn btn-sm btn-outline-danger btn-huy-don" data-id="' +
              d.id +
              '" data-sdt="' +
              sdt +
              '">Hủy đơn</button>';
          } else if (tt === "Đang thuê") {
            nut +=
              '<button type="button" class="btn btn-sm btn-outline-primary btn-tra-som" data-id="' +
              d.id +
              '" data-sdt="' +
              sdt +
              '">Trả xe trước hạn</button>';
          }
          return nut;
        }

        function hangNhomDon(nhom) {
          var d = nhom.daiDien;
          var tt = String(d.trangThai || "").trim();
          var soXe = (nhom.dong || []).filter(function (x) {
            return String(x.trangThai || "").trim() !== "Đã hủy";
          }).length;
          return (
            "<tr>" +
            "<td>#" +
            nhom.maNhom +
            (soXe > 1 ? '<br><small class="text-muted">' + soXe + " xe</small>" : "") +
            "</td>" +
            "<td><div class='order-vehicle-tags'>" +
            (htmlDanhSachXeTrongNhom(nhom) || '<span class="text-muted small">—</span>') +
            "</div></td>" +
            "<td>" +
            (d.tenKhachHang || "") +
            "</td>" +
            "<td>" +
            (d.soDienThoai || "") +
            "</td>" +
            "<td class='text-right'>" +
            formatTien(tongTienNhom(nhom)) +
            "</td>" +
            "<td><strong>" +
            tt +
            "</strong></td>" +
            "<td>" +
            nutQuanLyDon(nhom) +
            "</td>" +
            "</tr>"
          );
        }

        function bangTheoTrangThai(statusKey, danhSach, emailGui, sdtGui) {
          var tieuDe = (tabMeta[statusKey] || {}).title || "Danh sách đơn";
          if (!danhSach.length) {
            return (
              '<div class="order-list-box"><h5 class="mb-2">' +
              tieuDe +
              '</h5><p class="text-muted small mb-0">Chưa có đơn.</p></div>'
            );
          }
          var nhomList = gomDonTheoNhom(danhSach);
          var rows = nhomList.map(function (n) {
            return hangNhomDon(n);
          });
          return (
            '<div class="order-list-box"><h5 class="mb-3">' +
            tieuDe +
            '</h5><div class="table-responsive"><table class="table table-bordered table-sm bg-white"><thead class="thead-light"><tr><th>Mã đơn</th><th>Xe thuê</th><th>Khách</th><th>SĐT</th><th class="text-right">Tạm tính</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>' +
            rows.join("") +
            "</tbody></table></div></div>"
          );
        }

        function renderTabs() {
          return (
            '<div class="order-status-tabs">' +
            '<button type="button" class="order-status-tab' +
            (activeTab === "cho" ? " active" : "") +
            '" data-tab="cho">Đơn chờ TT/duyệt</button>' +
            '<button type="button" class="order-status-tab' +
            (activeTab === "dang" ? " active" : "") +
            '" data-tab="dang">Đơn đang thuê</button>' +
            '<button type="button" class="order-status-tab' +
            (activeTab === "xong" ? " active" : "") +
            '" data-tab="xong">Đơn hoàn thành</button>' +
            '<button type="button" class="order-status-tab' +
            (activeTab === "huy" ? " active" : "") +
            '" data-tab="huy">Đơn đã hủy</button>' +
            "</div>"
          );
        }

        function renderDon() {
          var out = document.getElementById("cacBangDon");
          if (!out) return;
          var htmlDon =
            renderTabs() +
            bangTheoTrangThai(activeTab, currentBuckets[activeTab] || [], emailHienTai, sdtTuDong);
          out.innerHTML = htmlDon;
        }

        function phanLoaiDon(list) {
          var cho = [],
            dang = [],
            xong = [],
            huy = [],
            khac = [];
          list.forEach(function (d) {
            var t = String(d.trangThai || "").trim();
            if (t === "Chờ duyệt" || t === "Chờ thanh toán") cho.push(d);
            else if (t === "Đang thuê") dang.push(d);
            else if (t === "Hoàn thành") xong.push(d);
            else if (t === "Đã hủy") huy.push(d);
            else khac.push(d);
          });
          return { cho: cho, dang: dang, xong: xong, huy: huy, khac: khac };
        }

        function taiDon(email, sdt, emailForm) {
          var err = document.getElementById("donLoiTai");
          var out = document.getElementById("cacBangDon");
          err.classList.add("d-none");
          out.innerHTML =
            '<p class="text-center text-muted py-4">Đang tải...</p>';
          var q = [];
          if (email) q.push("email=" + encodeURIComponent(email));
          if (sdt) q.push("soDienThoai=" + encodeURIComponent(sdt.replace(/\D/g, "")));
          var url = API_BASE + "/api/don-thue/cua-toi" + (q.length ? "?" + q.join("&") : "");
          fetch(url)
            .then(function (r) {
              if (!r.ok) throw new Error();
              return r.json();
            })
            .then(function (data) {
              var arr = data || [];
              if (!arr.length && emailForm) {
                err.textContent =
                  "Không tìm thấy đơn theo thông tin tra cứu. Vui lòng kiểm tra lại SĐT / email.";
                err.classList.remove("d-none");
              }
              var buckets = phanLoaiDon(data || []);
              emailHienTai = email || emailForm || emailHienTai || "";
              sdtTuDong = sdt || sdtTuDong || "";
              currentBuckets = {
                cho: buckets.cho || [],
                dang: buckets.dang || [],
                xong: buckets.xong || [],
                huy: buckets.huy || []
              };
              renderDon();
            })
            .catch(function () {
              out.innerHTML = "";
              err.textContent = "Không tải được danh sách đơn. Vui lòng kiểm tra backend cổng 8081.";
              err.classList.remove("d-none");
            });
        }

        function emailChoKhachThaoTac() {
          if (emailHienTai) return emailHienTai;
          var f = document.getElementById("traCuuEmail").value.trim();
          return f;
        }

        function sdtChoKhachThaoTac(sdtGoiY) {
          if (sdtGoiY) return String(sdtGoiY).replace(/\D/g, "");
          if (sdtTuDong) return String(sdtTuDong).replace(/\D/g, "");
          return document.getElementById("traCuuSdt").value.replace(/\D/g, "");
        }

        function taiDanhSachXeKho() {
          return fetch(API_BASE + "/api/xe/danh-sach")
            .then(function (r) {
              if (!r.ok) throw new Error();
              return r.json();
            })
            .then(function (data) {
              danhSachXeKho = (data || []).filter(function (xe) {
                var tt = String(xe.trangThai || "").toLowerCase();
                return (
                  tt.indexOf("rảnh") !== -1 ||
                  tt.indexOf("ranh") !== -1 ||
                  tt.indexOf("sẵn") !== -1 ||
                  tt.indexOf("available") !== -1
                );
              });
              if (!danhSachXeKho.length) danhSachXeKho = data || [];
              return danhSachXeKho;
            });
        }

        function renderChiTietDonModal(view) {
          var body = document.getElementById("modalXemDonBody");
          var btnThem = document.getElementById("btnThemXeTuXemDon");
          if (!body || !view) return;

          var html =
            '<p class="mb-2"><strong>Mã nhóm đơn:</strong> #' +
            (view.maNhom || "—") +
            "</p>" +
            '<p class="mb-2"><strong>Khách:</strong> ' +
            (view.tenKhachHang || "") +
            " — " +
            (view.soDienThoai || "") +
            "</p>" +
            '<p class="mb-2"><strong>Trạng thái:</strong> ' +
            (view.trangThai || "") +
            "</p>" +
            '<p class="mb-3"><strong>Tổng tạm tính:</strong> ' +
            formatTien(view.tongTienNhom) +
            "</p>" +
            "<h6 class='font-weight-bold mb-2'>Danh sách xe trong đơn</h6>";

          (view.cacDong || []).forEach(function (d) {
            var tt = String(d.trangThai || "").trim();
            if (tt === "Đã hủy") return;
            var nutDong = "";
            if (view.choPhepSua) {
              nutDong =
                '<button type="button" class="btn btn-sm btn-outline-primary mr-1 btn-sua-xe-dong" data-dong-id="' +
                d.id +
                '" data-don-id="' +
                (view.maNhom || d.id) +
                '" data-sdt="' +
                escAttr(d.soDienThoai || "") +
                '">Sửa</button>' +
                '<button type="button" class="btn btn-sm btn-outline-danger btn-xoa-xe-dong" data-dong-id="' +
                d.id +
                '" data-sdt="' +
                escAttr(d.soDienThoai || "") +
                '">Xóa khỏi đơn</button>';
            }
            html +=
              '<div class="order-detail-line">' +
              "<div><strong>" +
              (d.tenXe || "") +
              "</strong> <span class='text-muted'>(" +
              (d.bienSo || "") +
              ")</span></div>" +
              '<div class="small text-muted">Dòng #' +
              d.id +
              " — " +
              formatTien(d.tongTien) +
              "</div>" +
              '<div class="mt-2">' +
              nutDong +
              "</div></div>";
          });

          body.innerHTML = html;
          if (btnThem) {
            if (view.choPhepSua) {
              btnThem.classList.remove("d-none");
              btnThem.setAttribute("data-id", String(donDangXemId || view.maNhom || ""));
              btnThem.setAttribute(
                "data-sdt",
                escAttr(view.soDienThoai || "")
              );
            } else {
              btnThem.classList.add("d-none");
            }
          }
        }

        function moModalXemDon(donId, sdt) {
          donDangXemId = donId;
          var email = emailChoKhachThaoTac();
          var body = document.getElementById("modalXemDonBody");
          if (body) body.innerHTML = '<p class="text-muted">Đang tải chi tiết đơn...</p>';
          $("#modalXemDon").modal("show");

          var q = new URLSearchParams({
            email: email,
            soDienThoai: sdtChoKhachThaoTac(sdt)
          });
          fetch(API_BASE + "/api/don-thue/" + donId + "/xem?" + q.toString())
            .then(function (r) {
              if (!r.ok) throw new Error();
              return r.json();
            })
            .then(function (view) {
              renderChiTietDonModal(view);
            })
            .catch(function () {
              if (body) {
                body.innerHTML =
                  '<p class="text-danger">Không tải được chi tiết đơn.</p>';
              }
            });
        }

        function moModalQuanLyXe(cheDo, donId, dongId, sdt) {
          document.getElementById("qlCheDo").value = cheDo;
          document.getElementById("qlDonId").value = donId || "";
          document.getElementById("qlDongId").value = dongId || "";
          document.getElementById("qlTongTien").value = "";
          document.getElementById("qlGiaGoiY").textContent = "";
          document.getElementById("qlGhiChu").textContent =
            cheDo === "sua"
              ? "Cập nhật xe hoặc tạm tính cho dòng đơn #" + dongId
              : "Thêm xe vào đơn nhóm #" + donId;

          document.getElementById("modalQuanLyXeDonTitle").textContent =
            cheDo === "sua" ? "Cập nhật xe trong đơn" : "Thêm xe vào đơn";

          var sel = document.getElementById("qlChonXe");
          sel.innerHTML = '<option value="">Đang tải...</option>';

          taiDanhSachXeKho()
            .then(function (list) {
              sel.innerHTML = HKTVehicleOptions.buildVehicleOptions(list);
              if (cheDo === "sua" && dongId) {
                var buckets = [].concat(
                  currentBuckets.cho || [],
                  currentBuckets.dang || [],
                  currentBuckets.xong || [],
                  currentBuckets.huy || []
                );
                var dong = buckets.find(function (x) {
                  return String(x.id) === String(dongId);
                });
                if (dong) {
                  HKTVehicleOptions.selectVehicleByName(sel, dong.tenXe);
                  document.getElementById("qlTongTien").value =
                    dong.tongTien || "";
                  capNhatGiaGoiYTuSelect();
                }
              }
            })
            .catch(function () {
              sel.innerHTML =
                '<option value="">Không tải được danh sách xe</option>';
            });

          $("#modalQuanLyXeDon").modal("show");
        }

        function layMetaTuSelectXe() {
          var sel = document.getElementById("qlChonXe");
          if (!sel || !sel.value) return null;
          try {
            return JSON.parse(sel.value);
          } catch (e) {
            return null;
          }
        }

        function capNhatGiaGoiYTuSelect() {
          var meta = layMetaTuSelectXe();
          var el = document.getElementById("qlGiaGoiY");
          var tien = document.getElementById("qlTongTien");
          if (!meta) {
            if (el) el.textContent = "";
            return;
          }
          var gia = Number(meta.giaThue) || 0;
          if (el) {
            el.textContent =
              "Gợi ý: " + gia.toLocaleString("vi-VN") + " ₫/ngày (1 ngày)";
          }
          if (tien && (!tien.value || Number(tien.value) <= 0)) {
            tien.value = gia > 0 ? String(Math.round(gia)) : "";
          }
        }

        function reloadDonSauThaoTac() {
          if (emailHienTai) taiDon(emailHienTai, "", "");
          else
            taiDon(
              "",
              document.getElementById("traCuuSdt").value,
              document.getElementById("traCuuEmail").value.trim()
            );
        }

        function moQrThanhToanLai(id, soDienThoai, email, soTien, hanThanhToan) {
          if (!paymentQrFlowOrders || !id) return;
          paymentQrFlowOrders.open({
            orderId: id,
            amount: Number(soTien || 0),
            soDienThoai: (soDienThoai || "").replace(/\D/g, ""),
            email: email || emailChoKhachThaoTac() || "",
            expireAtMs: parseExpireAtMs(hanThanhToan)
          });
        }

        document.getElementById("qlChonXe").addEventListener("change", capNhatGiaGoiYTuSelect);

        document.getElementById("formQuanLyXeDon").addEventListener("submit", function (e) {
          e.preventDefault();
          var meta = layMetaTuSelectXe();
          if (!meta || !meta.bienSo) {
            alert("Vui lòng chọn xe.");
            return;
          }
          var cheDo = document.getElementById("qlCheDo").value;
          var donId = document.getElementById("qlDonId").value;
          var dongId = document.getElementById("qlDongId").value;
          var tong = parseFloat(document.getElementById("qlTongTien").value);
          if (isNaN(tong) || tong <= 0) {
            alert("Nhập tạm tính hợp lệ.");
            return;
          }
          var payload = {
            email: emailChoKhachThaoTac(),
            soDienThoai: sdtChoKhachThaoTac(),
            tenXe: meta.tenXe,
            bienSo: meta.bienSo,
            tongTien: tong
          };
          var url =
            cheDo === "sua"
              ? API_BASE + "/api/don-thue/" + dongId + "/cap-nhat"
              : API_BASE + "/api/don-thue/" + donId + "/them-xe";
          fetch(url, {
            method: cheDo === "sua" ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          })
            .then(function (r) {
              return r.text().then(function (t) {
                var data = null;
                try {
                  data = JSON.parse(t);
                } catch (err) {}
                return { ok: r.ok, body: t, data: data };
              });
            })
            .then(function (x) {
              if (!x.ok) {
                alert(x.body || "Lưu thất bại.");
                return;
              }
              alert(cheDo === "sua" ? "Đã cập nhật xe trong đơn." : "Đã thêm xe vào đơn.");
              $("#modalQuanLyXeDon").modal("hide");
              reloadDonSauThaoTac();
              if (donDangXemId) moModalXemDon(donDangXemId, payload.soDienThoai);
            })
            .catch(function () {
              alert("Lỗi kết nối máy chủ.");
            });
        });

        document.getElementById("btnThemXeTuXemDon").addEventListener("click", function () {
          var id = this.getAttribute("data-id");
          var sdt = this.getAttribute("data-sdt");
          moModalQuanLyXe("them", id, "", sdt);
        });

        document.getElementById("modalXemDonBody").addEventListener("click", function (e) {
          var btnSua = e.target.closest(".btn-sua-xe-dong");
          var btnXoa = e.target.closest(".btn-xoa-xe-dong");
          if (btnSua) {
            moModalQuanLyXe(
              "sua",
              btnSua.getAttribute("data-don-id"),
              btnSua.getAttribute("data-dong-id"),
              btnSua.getAttribute("data-sdt")
            );
            return;
          }
          if (btnXoa) {
            if (!confirm("Xóa xe này khỏi đơn thuê?")) return;
            var q = new URLSearchParams({
              email: emailChoKhachThaoTac(),
              soDienThoai: sdtChoKhachThaoTac(btnXoa.getAttribute("data-sdt"))
            });
            fetch(
              API_BASE +
                "/api/don-thue/" +
                btnXoa.getAttribute("data-dong-id") +
                "/dong?" +
                q.toString(),
              { method: "DELETE" }
            )
              .then(function (r) {
                return r.text().then(function (t) {
                  return { ok: r.ok, body: t };
                });
              })
              .then(function (x) {
                alert(x.body || (x.ok ? "Đã xóa." : "Lỗi"));
                if (x.ok) {
                  reloadDonSauThaoTac();
                  if (donDangXemId) moModalXemDon(donDangXemId, btnXoa.getAttribute("data-sdt"));
                }
              })
              .catch(function () {
                alert("Lỗi kết nối.");
              });
          }
        });

        document.getElementById("cacBangDon").addEventListener("click", function (e) {
          var tabBtn = e.target.closest(".order-status-tab");
          if (tabBtn) {
            activeTab = tabBtn.getAttribute("data-tab") || "cho";
            renderDon();
            return;
          }
          var xemDon = e.target.closest(".btn-xem-don");
          var themXe = e.target.closest(".btn-them-xe-don");
          if (xemDon) {
            moModalXemDon(xemDon.getAttribute("data-id"), xemDon.getAttribute("data-sdt"));
            return;
          }
          if (themXe) {
            moModalQuanLyXe("them", themXe.getAttribute("data-id"), "", themXe.getAttribute("data-sdt"));
            return;
          }
          var xacNhanTt = e.target.closest(".btn-xac-nhan-tt");
          var moQr = e.target.closest(".btn-mo-qr");
          if (moQr) {
            moQrThanhToanLai(
              moQr.getAttribute("data-id"),
              moQr.getAttribute("data-sdt"),
              moQr.getAttribute("data-email"),
              moQr.getAttribute("data-tien"),
              moQr.getAttribute("data-han")
            );
            return;
          }
          if (xacNhanTt) {
            var idTt = xacNhanTt.getAttribute("data-id");
            var sdtTt = xacNhanTt.getAttribute("data-sdt");
            var emailTt = emailChoKhachThaoTac();
            var pTt = new URLSearchParams({
              email: emailTt,
              soDienThoai: (sdtTt || "").replace(/\D/g, ""),
              kenhThanhToan: "MoMo"
            });
            fetch(API_BASE + "/api/don-thue/xac-nhan-thanh-toan/" + idTt + "?" + pTt.toString(), {
              method: "PUT"
            })
              .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, body: t }; }); })
              .then(function (x) {
                alert(x.body || (x.ok ? "Đã xác nhận thanh toán." : "Có lỗi"));
                if (x.ok) {
                  if (emailHienTai) taiDon(emailHienTai, "", "");
                  else taiDon("", document.getElementById("traCuuSdt").value, document.getElementById("traCuuEmail").value.trim());
                }
              })
              .catch(function () { alert("Lỗi kết nối máy chủ khi xác nhận thanh toán."); });
            return;
          }
          var huy = e.target.closest(".btn-huy-don");
          var tra = e.target.closest(".btn-tra-som");
          var btn = huy || tra;
          if (!btn) return;
          var id = btn.getAttribute("data-id");
          var sdt = btn.getAttribute("data-sdt");
          var email = emailChoKhachThaoTac();
          var hanh = huy ? "huy" : "tra_som";
          var msg = huy
            ? "Bạn chắc chắn muốn hủy đơn này?"
            : "Xác nhận trả xe trước hạn? Xe sẽ được trả về kho (hoàn tất đơn).";
          if (!confirm(msg)) return;
          var params = new URLSearchParams({
            email: email,
            soDienThoai: (sdt || "").replace(/\D/g, ""),
            hanhDong: hanh
          });
          fetch(API_BASE + "/api/don-thue/khach-thao-tac/" + id + "?" + params.toString(), {
            method: "PUT"
          })
            .then(function (r) {
              return r.text().then(function (t) {
                return { ok: r.ok, body: t };
              });
            })
            .then(function (x) {
              alert(x.body || (x.ok ? "Đã xử lý." : "Lỗi"));
              if (x.ok) {
                if (emailHienTai) taiDon(emailHienTai, "", "");
                else
                  taiDon(
                    "",
                    document.getElementById("traCuuSdt").value,
                    document.getElementById("traCuuEmail").value.trim()
                  );
              }
            })
            .catch(function () {
              alert("Lỗi kết nối.");
            });
        });

        document.getElementById("btnTraCuuDon").addEventListener("click", function () {
          var sdt = document.getElementById("traCuuSdt").value.replace(/\D/g, "");
          var emailNhap = document.getElementById("traCuuEmail").value.trim();
          if (!/^\d{10}$/.test(sdt)) {
            alert("Nhập đúng 10 chữ số SĐT.");
            return;
          }
          if (emailNhap && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailNhap)) {
            alert("Email không hợp lệ. Vui lòng nhập đúng định dạng, ví dụ: ten@email.com");
            return;
          }
          emailHienTai = "";
          taiDon("", sdt, emailNhap);
        });

        document.getElementById("traCuuSdt").addEventListener("input", function () {
          this.value = this.value.replace(/\D/g, "").slice(0, 10);
        });

        paymentQrFlowOrders = HKTPaymentQr.createQrPaymentFlow({
          apiBase: API_BASE,
          modalId: "paymentQrModalOrders",
          amountId: "paymentQrAmountOrders",
          qrImageId: "paymentQrImageOrders",
          qrHintId: "paymentQrHintOrders",
          countdownId: "paymentQrCountdownOrders",
          btnMomoId: "btnPayMomoOrders",
          btnConfirmId: "btnConfirmPaidOrders",
          staticQrImage: "images/momo-qr-fixed.png",
          onConfirmed: function () {
            if (emailHienTai) taiDon(emailHienTai, "", "");
            else taiDon("", document.getElementById("traCuuSdt").value, document.getElementById("traCuuEmail").value.trim());
          }
        });

        taiDanhSachXeKho().catch(function () {});

        var u = layUser();
        var role = u ? String(u.role || "").trim().toUpperCase() : "";
        var ghiChu = document.getElementById("donGhiChuTaiKhoan");
        var khungSdt = document.getElementById("khungTraCuuSdt");

        if (u && role !== "ADMIN") {
          emailHienTai = u.email || "";
          sdtTuDong = (u.sdt || u.phone || "").replace(/\D/g, "");
          khungSdt.classList.add("d-none");
          ghiChu.textContent =
            "Đăng nhập: " +
            (u.email || "") +
            ". Bạn có thể xem đơn, thêm/sửa/xóa xe trong đơn đang chờ thanh toán hoặc chờ duyệt.";
          taiDon(emailHienTai, "", "");
        } else if (role === "ADMIN") {
          ghiChu.innerHTML =
            '';
          khungSdt.classList.remove("d-none");
          document.getElementById("cacBangDon").innerHTML = "";
        } else {
          khungSdt.classList.remove("d-none");
        }
      })();
    </script>
    <script>
      HKTAuth.renderAuthMenu({
        navAuthAreaId: "navAuthArea",
        navOrdersId: "navDonCuaToi",
        adminLink: "admin/index.html",
        logoutId: "btnDangXuatDon"
      });
    </script>
  </body>
</html>
