<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - HKTGO Thuê Xe</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      body, html {
        height: 100%;
        width: 100%;
        background-color: #f8f9fa;
      }

      .split-container {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Bên trái: Ảnh xe đi tour phượt */
      .split-image {
        flex: 1.1;
        background: url("https://images.unsplash.com/photo-1558981806-ec527fa84c39?q=80&w=1920&auto=format&fit=crop")
                    center center / cover no-repeat,
                    url("../images/bg_1.jpg") center center / cover no-repeat;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 48px;
        color: #fff;
      }

      .split-image::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
      }

      .image-caption {
        position: relative;
        z-index: 2;
        max-width: 520px;
      }

      .image-caption h2 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 12px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.4);
      }

      .image-caption p {
        font-size: 16px;
        line-height: 1.5;
        color: #e0e0e0;
      }

      /* Bên phải: Form đăng ký */
      .split-form {
        flex: 0.9;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        background: #ffffff;
        overflow-y: auto;
      }

      .form-wrapper {
        width: 100%;
        max-width: 440px;
      }

      .brand-title {
        font-size: 28px;
        font-weight: 700;
        color: #212529;
        margin-bottom: 8px;
      }

      .brand-subtitle {
        font-size: 14px;
        color: #6c757d;
        margin-bottom: 24px;
        line-height: 1.5;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        color: #495057;
        margin-bottom: 6px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper input {
        width: 100%;
        padding: 12px 15px;
        font-size: 14.5px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        background-color: #fff;
        color: #333;
      }

      .input-wrapper input:focus {
        border-color: #eb6c00;
        box-shadow: 0 0 0 3px rgba(235, 108, 0, 0.15);
      }

      .toggle-pass-btn {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6c757d;
      }

      .btn-submit {
        width: 100%;
        padding: 13px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background-color: #eb6c00;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
        transition: background-color 0.2s, transform 0.1s;
      }

      .btn-submit:hover {
        background-color: #d45f00;
      }

      .btn-submit:active {
        transform: scale(0.99);
      }

      .bottom-nav {
        margin-top: 24px;
        text-align: center;
        font-size: 14px;
        color: #6c757d;
      }

      .bottom-nav a {
        color: #eb6c00;
        font-weight: 600;
        text-decoration: none;
      }

      .bottom-nav a:hover {
        text-decoration: underline;
      }

      #regAlert {
        display: none;
        padding: 11px 14px;
        border-radius: 6px;
        font-size: 13.5px;
        margin-bottom: 18px;
        text-align: center;
        font-weight: 500;
      }

      @media (max-width: 900px) {
        .split-image {
          display: none;
        }
        .split-form {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="split-container">
      <!-- Bên trái: Ảnh xe tour -->
      <div class="split-image">
        <div class="image-caption">
          <h2>Bắt đầu hành trình mới</h2>
          <p>Tạo tài khoản HKTGO chỉ trong 1 phút để trải nghiệm dịch vụ thuê xe chất lượng cao với mức giá ưu đãi nhất.</p>
        </div>
      </div>

      <!-- Bên phải: Form đăng ký -->
      <div class="split-form">
        <div class="form-wrapper">
          <div class="brand-title">Đăng ký tài khoản</div>
          <div class="brand-subtitle">Điền thông tin bên dưới để đăng ký tài khoản khách hàng.</div>

          <div id="regAlert"></div>

          <form id="formDangKy" onsubmit="return false;">
            <div class="form-group">
              <label for="hoTen">Họ và tên</label>
              <div class="input-wrapper">
                <input
                  type="text"
                  id="hoTen"
                  placeholder="Ví dụ: Nguyễn Văn Minh"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="email">Địa chỉ Email</label>
              <div class="input-wrapper">
                <input
                  type="email"
                  id="email"
                  placeholder="Ví dụ: khachhang@gmail.com"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="soDienThoai">Số điện thoại</label>
              <div class="input-wrapper">
                <input
                  type="tel"
                  id="soDienThoai"
                  placeholder="10 chữ số, ví dụ: 0912345678"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="matKhau">Mật khẩu</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="matKhau"
                  placeholder="Tối thiểu 6 ký tự"
                  required
                />
                <i class="fa-regular fa-eye toggle-pass-btn" id="togglePass1"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="nhapLaiMatKhau">Xác nhận lại mật khẩu</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="nhapLaiMatKhau"
                  placeholder="Nhập lại đúng mật khẩu phía trên"
                  required
                />
                <i class="fa-regular fa-eye toggle-pass-btn" id="togglePass2"></i>
              </div>
            </div>

            <button type="button" class="btn-submit" id="btnDangKy">
              Đăng ký ngay
            </button>
          </form>

          <div class="bottom-nav">
            Đã có tài khoản? <a href="login.html">Đăng nhập tại đây</a>
            <div style="margin-top: 10px;">
              <a href="../index.html" style="color: #888; font-weight: normal; font-size: 13px;">
                <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function togglePassword(inputId, iconId) {
        var passInput = document.getElementById(inputId);
        var toggleIcon = document.getElementById(iconId);
        if (!passInput || !toggleIcon) return;

        if (passInput.type === "password") {
          passInput.type = "text";
          toggleIcon.classList.remove("fa-eye");
          toggleIcon.classList.add("fa-eye-slash");
        } else {
          passInput.type = "password";
          toggleIcon.classList.remove("fa-eye-slash");
          toggleIcon.classList.add("fa-eye");
        }
      }

      document.getElementById("togglePass1").addEventListener("click", function () {
        togglePassword("matKhau", "togglePass1");
      });
      document.getElementById("togglePass2").addEventListener("click", function () {
        togglePassword("nhapLaiMatKhau", "togglePass2");
      });

      function showRegAlert(msg, type) {
        var alertEl = document.getElementById("regAlert");
        if (!alertEl) return;
        alertEl.style.display = "block";
        if (type === "success") {
          alertEl.style.background = "#d4edda";
          alertEl.style.border = "1px solid #c3e6cb";
          alertEl.style.color = "#155724";
          alertEl.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> ' + msg;
        } else if (type === "info") {
          alertEl.style.background = "#cce5ff";
          alertEl.style.border = "1px solid #b8daff";
          alertEl.style.color = "#004085";
          alertEl.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> ' + msg;
        } else {
          alertEl.style.background = "#f8d7da";
          alertEl.style.border = "1px solid #f5c6cb";
          alertEl.style.color = "#721c24";
          alertEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> ' + msg;
        }
      }

      async function handleRegister() {
        var hoTen = document.getElementById("hoTen").value.trim();
        var email = document.getElementById("email").value.trim();
        var sdt = document.getElementById("soDienThoai").value.trim();
        var pass1 = document.getElementById("matKhau").value.trim();
        var pass2 = document.getElementById("nhapLaiMatKhau").value.trim();

        if (!hoTen) {
          showRegAlert("Vui lòng nhập Họ và tên!", "error");
          return;
        }
        if (!email) {
          showRegAlert("Vui lòng nhập Địa chỉ Email!", "error");
          return;
        }
        if (!sdt || !/^0[1-9][0-9]{8}$/.test(sdt.replace(/[\s.-]/g, ""))) {
          showRegAlert("Vui lòng nhập Số điện thoại hợp lệ (10 chữ số, bắt đầu bằng số 0)!", "error");
          return;
        }
        if (!pass1 || pass1.length < 6) {
          showRegAlert("Mật khẩu phải có ít nhất 6 ký tự!", "error");
          return;
        }
        if (pass1 !== pass2) {
          showRegAlert("Mật khẩu xác nhận không khớp. Vui lòng kiểm tra lại!", "error");
          return;
        }

        var btn = document.getElementById("btnDangKy");
        if (btn) btn.disabled = true;
        showRegAlert("Đang đăng ký tài khoản...", "info");

        var duLieuGuiDi = {
          hoTen: hoTen,
          name: hoTen,
          email: email,
          sdt: sdt,
          account: email,
          password: pass1
        };

        var endpoints = [
          "http://127.0.0.1:8081/api/users/dang-ky",
          "http://localhost:8081/api/users/dang-ky"
        ];
        if (window.location.hostname && window.location.hostname !== "127.0.0.1" && window.location.hostname !== "localhost") {
          endpoints.unshift("http://" + window.location.hostname + ":8081/api/users/dang-ky");
        }

        var lastErr = null;
        for (var i = 0; i < endpoints.length; i++) {
          try {
            var res = await fetch(endpoints[i], {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(duLieuGuiDi)
            });
            var thongBao = await res.text();
            if (btn) btn.disabled = false;
            if (res.ok) {
              showRegAlert("✅ " + (thongBao || "Đăng ký tài khoản thành công! Đang chuyển đến Đăng nhập..."), "success");
              setTimeout(function () {
                window.location.href = "login.html";
              }, 1200);
              return;
            } else {
              showRegAlert(thongBao || "Đăng ký không thành công!", "error");
              return;
            }
          } catch (err) {
            lastErr = err;
          }
        }

        if (btn) btn.disabled = false;
        showRegAlert("Không thể kết nối đến máy chủ backend cổng 8081.", "error");
      }

      document.getElementById("btnDangKy").addEventListener("click", handleRegister);

      document.getElementById("nhapLaiMatKhau").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          handleRegister();
        }
      });
    </script>
  </body>
</html>
