<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - HKTGO Thuê Xe</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      body, html {
        height: 100%;
        width: 100%;
        background-color: #f8f9fa;
      }

      .split-container {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Bên trái: Ảnh xe đi tour phượt */
      .split-image {
        flex: 1.1;
        background: url("https://images.unsplash.com/photo-1558981806-ec527fa84c39?q=80&w=1920&auto=format&fit=crop")
                    center center / cover no-repeat,
                    url("../images/bg_1.jpg") center center / cover no-repeat;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 48px;
        color: #fff;
      }

      .split-image::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
      }

      .image-caption {
        position: relative;
        z-index: 2;
        max-width: 520px;
      }

      .image-caption h2 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 12px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.4);
      }

      .image-caption p {
        font-size: 16px;
        line-height: 1.5;
        color: #e0e0e0;
      }

      /* Bên phải: Form đăng nhập thanh lịch */
      .split-form {
        flex: 0.9;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        background: #ffffff;
        overflow-y: auto;
      }

      .form-wrapper {
        width: 100%;
        max-width: 420px;
      }

      .brand-title {
        font-size: 28px;
        font-weight: 700;
        color: #212529;
        margin-bottom: 8px;
      }

      .brand-subtitle {
        font-size: 14px;
        color: #6c757d;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #495057;
        margin-bottom: 8px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper input {
        width: 100%;
        padding: 13px 16px;
        font-size: 15px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        background-color: #fff;
        color: #333;
      }

      .input-wrapper input:focus {
        border-color: #eb6c00;
        box-shadow: 0 0 0 3px rgba(235, 108, 0, 0.15);
      }

      .toggle-pass-btn {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6c757d;
        border: none;
        background: transparent;
      }

      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13.5px;
        margin-bottom: 26px;
      }

      .form-options label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: #495057;
      }

      .form-options a {
        color: #6c757d;
        text-decoration: underline;
        font-size: 13.5px;
      }

      .form-options a:hover {
        color: #eb6c00;
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background-color: #eb6c00;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
      }

      .btn-submit:hover {
        background-color: #d45f00;
      }

      .btn-submit:active {
        transform: scale(0.99);
      }

      .bottom-nav {
        margin-top: 28px;
        text-align: center;
        font-size: 14px;
        color: #6c757d;
      }

      .bottom-nav a {
        color: #eb6c00;
        font-weight: 600;
        text-decoration: none;
      }

      .bottom-nav a:hover {
        text-decoration: underline;
      }

      #loginAlert {
        display: none;
        padding: 12px 14px;
        border-radius: 6px;
        font-size: 13.5px;
        margin-bottom: 20px;
        text-align: center;
        font-weight: 500;
      }

      @media (max-width: 900px) {
        .split-image {
          display: none;
        }
        .split-form {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="split-container">
      <!-- Bên trái: Ảnh xe phượt tour -->
      <div class="split-image">
        <div class="image-caption">
          <h2>Khám phá mọi hành trình</h2>
          <p>Thuê xe máy tự lái nhanh chóng, an toàn và tiện lợi cùng HKTGO. Đồng hành cùng bạn trên mọi nẻo đường đất nước.</p>
        </div>
      </div>

      <!-- Bên phải: Form đăng nhập -->
      <div class="split-form">
        <div class="form-wrapper">
          <div class="brand-title">Đăng nhập</div>
          <div class="brand-subtitle">Chào mừng bạn quay lại hệ thống quản lý thuê xe HKTGO.</div>

          <div id="loginAlert"></div>

          <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
              <label for="exampleInputEmail">Tài khoản / Email / SĐT</label>
              <div class="input-wrapper">
                <input
                  type="text"
                  id="exampleInputEmail"
                  placeholder="Nhập email hoặc tên tài khoản"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="exampleInputPassword">Mật khẩu</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="exampleInputPassword"
                  placeholder="Nhập mật khẩu"
                  required
                />
                <i class="fa-regular fa-eye toggle-pass-btn" id="toggleIcon"></i>
              </div>
            </div>

            <div class="form-options">
              <label>
                <input type="checkbox" id="customCheck" checked /> Ghi nhớ tôi
              </label>
              <a href="#">Quên mật khẩu?</a>
            </div>

            <button type="button" class="btn-submit" id="btnDangNhap">
              Đăng nhập
            </button>
          </form>

          <div class="bottom-nav">
            Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
            <div style="margin-top: 10px;">
              <a href="../index.html" style="color: #888; font-weight: normal; font-size: 13px;">
                <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ khách hàng
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var toggleIcon = document.getElementById("toggleIcon");
      var passInput = document.getElementById("exampleInputPassword");
      if (toggleIcon && passInput) {
        toggleIcon.addEventListener("click", function () {
          if (passInput.type === "password") {
            passInput.type = "text";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
          } else {
            passInput.type = "password";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
          }
        });
      }

      function showLoginAlert(msg, type) {
        var alertEl = document.getElementById("loginAlert");
        if (!alertEl) return;
        alertEl.style.display = "block";
        if (type === "success") {
          alertEl.style.background = "#d4edda";
          alertEl.style.border = "1px solid #c3e6cb";
          alertEl.style.color = "#155724";
          alertEl.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> ' + msg;
        } else if (type === "info") {
          alertEl.style.background = "#cce5ff";
          alertEl.style.border = "1px solid #b8daff";
          alertEl.style.color = "#004085";
          alertEl.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> ' + msg;
        } else {
          alertEl.style.background = "#f8d7da";
          alertEl.style.border = "1px solid #f5c6cb";
          alertEl.style.color = "#721c24";
          alertEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> ' + msg;
        }
      }

      function saveUserSession(userData) {
        var str = JSON.stringify(userData);
        try { localStorage.setItem("thong_tin_user", str); } catch(e){}
        try { sessionStorage.setItem("thong_tin_user", str); } catch(e){}
        try {
          var exp = new Date(Date.now() + 7 * 864e5).toUTCString();
          document.cookie = "thong_tin_user=" + encodeURIComponent(str) + "; path=/; expires=" + exp;
        } catch(e){}
      }

      async function performLogin(loginIdentifier, loginPassword) {
        var btn = document.getElementById("btnDangNhap");
        if (btn) btn.disabled = true;
        showLoginAlert("Đang xác thực thông tin đăng nhập...", "info");

        var endpoints = [
          "http://127.0.0.1:8081/api/login",
          "http://localhost:8081/api/login"
        ];
        if (window.location.hostname && window.location.hostname !== "127.0.0.1" && window.location.hostname !== "localhost") {
          endpoints.unshift("http://" + window.location.hostname + ":8081/api/login");
        }

        var result = null;
        var lastErr = null;

        for (var i = 0; i < endpoints.length; i++) {
          try {
            var resp = await fetch(endpoints[i], {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: loginIdentifier, password: loginPassword })
            });
            var json = await resp.json();
            if (resp.ok && json) {
              result = json;
              break;
            } else {
              lastErr = new Error(json.message || "Tài khoản hoặc mật khẩu không chính xác.");
              break;
            }
          } catch (e) {
            lastErr = e;
          }
        }

        if (btn) btn.disabled = false;

        if (!result) {
          var msg = (lastErr && lastErr.message) || "Không thể kết nối đến máy chủ backend (cổng 8081). Vui lòng thử lại.";
          showLoginAlert(msg, "error");
          return;
        }

        var payload = result.data || result;
        var roleRaw = (payload && (payload.vaiTro || payload.role || payload.authority)) || "";
        var role = String(roleRaw).trim().toUpperCase();

        var userData = {
          id: (payload && payload.id) || "",
          email: (payload && payload.email) || loginIdentifier,
          role: role
        };

        saveUserSession(userData);
        var uParam = encodeURIComponent(JSON.stringify(userData));

        if (role === "ADMIN") {
          showLoginAlert("✅ Đăng nhập Quản trị viên (Admin) thành công! Đang chuyển hướng...", "success");
          setTimeout(function () {
            window.location.href = "index.html?u=" + uParam;
          }, 300);
          return;
        }

        if (role === "MANAGER") {
          showLoginAlert("✅ Đăng nhập Quản lý (Manager) thành công! Đang chuyển hướng...", "success");
          setTimeout(function () {
            window.location.href = "index.html?u=" + uParam;
          }, 300);
          return;
        }

        if (role === "STAFF") {
          showLoginAlert("✅ Đăng nhập Nhân viên (Staff) thành công! Đang chuyển hướng...", "success");
          setTimeout(function () {
            window.location.href = "index.html?u=" + uParam;
          }, 300);
          return;
        }

        if (role === "USER" || role === "KHACH" || role === "CUSTOMER") {
          showLoginAlert("✅ Đăng nhập Khách hàng thành công! Đang chuyển hướng...", "success");
          setTimeout(function () {
            window.location.href = "../index.html?u=" + uParam;
          }, 300);
          return;
        }

        showLoginAlert("Đăng nhập thành công nhưng chưa xác định được quyền: " + role, "error");
      }

      function handleLoginSubmit() {
        var email = document.getElementById("exampleInputEmail").value.trim();
        var password = document.getElementById("exampleInputPassword").value.trim();
        if (!email || !password) {
          showLoginAlert("Vui lòng nhập tài khoản và mật khẩu!", "error");
          return;
        }
        performLogin(email, password);
      }

      document.getElementById("btnDangNhap").addEventListener("click", handleLoginSubmit);

      document.getElementById("exampleInputEmail").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("exampleInputPassword").focus();
        }
      });

      document.getElementById("exampleInputPassword").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          handleLoginSubmit();
        }
      });
    </script>
  </body>
</html>
